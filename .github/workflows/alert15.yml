name: intraday-15m
on:
  schedule:
    - cron: "1,16,31,46 * * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send test message"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bot-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SEND_TEST: ${{ github.event.inputs.test }}
          SESSION: "0"
        run: python bot15.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_15m.json
          git diff --cached --quiet || (git commit -m "state 15m" && git pull --rebase -q && git push)
